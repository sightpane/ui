dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # lib/l10n/*.arb → lib/l10n/gen/app_localizations.dart (flutter gen-l10n)
